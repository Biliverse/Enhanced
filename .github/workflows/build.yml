name: Build
on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - name: Update Package Version from Tag
        if: github.ref_type == 'tag'
        uses: BellCubeDev/update-package-version-by-release-tag@v2
        with:
          version: ${{ github.ref_name }}
          keep-v: "false" # If set to "true", will not remove any 'v' prefix from the version number.
          ignore-semver-check: "false" # If set to "true", will not check if the version number is a valid semver version.
      - name: Run Build Pipeline
        uses: ./.github/actions/node-build
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
          build-command: npm run build
          extra-command: test -s dist/Biliverse.Enhanced.yaml
      - name: Read Settings Content Revision
        id: settings-content
        run: echo "revision=$(node -p 'require("./package.json").preferencePanesContentRevision')" >> "$GITHUB_OUTPUT"
      - name: Checkout Settings Content
        uses: actions/checkout@v7
        with:
          repository: Biliverse/Biliverse.github.io
          ref: ${{ steps.settings-content.outputs.revision }}
          path: settings-content
          sparse-checkout: settings
      - name: Copy Settings Content
        run: |
          cp settings-content/settings/{home.json,theme.css,bridge.mjs} dist/
          cp settings-content/settings/assets/{Biliverse,Enhanced,Global,Redirect,ADBlock}_subject.png dist/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: |
            CHANGELOG.md
            rulesets
            dist
